<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find out what you owe me. 💸</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff3f7,#f5efff,#eef8ff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17151a}.wrap{max-width:680px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #eee;border-radius:28px;padding:28px;box-shadow:0 15px 45px #29142a18}h1{font-size:clamp(38px,8vw,60px);line-height:.95;letter-spacing:-2px;margin:12px 0}h2{margin:0 0 8px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8b4dff}p{color:#666;line-height:1.5}.q{margin:25px 0}label{display:block;font-weight:750;margin-bottom:9px}select{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;font-size:16px;background:white}button{width:100%;padding:15px;border:0;border-radius:15px;background:#17151a;color:white;font-weight:800;font-size:16px;cursor:pointer}.hidden{display:none}.amount{font-size:56px;font-weight:900;letter-spacing:-2px;margin:8px 0}.tier{font-size:22px;font-weight:850}.choice{border:2px solid #eee;border-radius:16px;padding:14px;margin:10px 0;cursor:pointer}.choice input{width:auto;margin-right:8px}.footer{text-align:center;color:#888;font-size:12px;margin-top:20px}</style></head><body><main class="wrap"><section class="card" id="quiz"><span class="eyebrow">Birthday Gift Calculator</span><h1>Find out what you owe me. 💸</h1><p>Okay. Let's see what you owe <b>Yun Qi</b>. Be honest. I will know if you're lying. Probably. 👀</p><div class="q"><label>How close are you to me?</label><select id="close"><option value="1">We barely know each other</option><option value="2">We're friends</option><option value="3">We're pretty close</option><option value="4">I'm basically family</option><option value="5">I know way too much about you</option></select></div><div class="q"><label>How much have you annoyed me this year?</label><select id="annoy"><option value="5">I am an angel 😇</option><option value="4">Barely at all</option><option value="3">A normal amount</option><option value="2">Okay... maybe a little</option><option value="1">I owe you an apology</option></select></div><div class="q"><label>How generous are you feeling?</label><select id="generosity"><option value="1">Financially struggling, sorry 😭</option><option value="2">Let's be reasonable</option><option value="3">I can stretch a little</option><option value="4">It's my favourite person's birthday</option><option value="5">Money is simply a concept</option></select></div><button id="go">Reveal my fate 💸</button></section><section class="card hidden" id="result"><span class="eyebrow">Your official birthday debt</span><h2 id="score"></h2><div class="amount" id="budget"></div><div class="tier" id="tier"></div><p>Congratulations. This is your assigned gift tier. Choose your gift wisely.</p><div id="choices"></div><button id="share">I've chosen my gift 🎁</button></section><div class="footer">Made with questionable financial judgment 💸</div></main><script>const tiers=[{name:'People who forgot my bday last year',budget:'RM20–30',items:['A good meal and an apology note to why you forgot last year :/']},{name:'Friends',budget:'RM5-20',items:['Silver Claw Clip','Silver Jewelry','Knee High White Socks']},{name:'Close friends',budget:'RM30-50',items:['Something funny','Something sentimental','Zuru Slime Mart','Edible Cookie Dough','Good Brie Cheese']},{name:'Family',budget:'RM 30-800',items:['Sponsor My Taobao Order','Sponsor My SHEIN Order','Sponsor My Shopee Order','Onitsuka Tiger Red Shoe','Adidas Gazelle (Neutral)','New Branded Sewing Machine']}];go.onclick=()=>{let s=+close.value+ +annoy.value+ +generosity.value,score=Math.round(s/15*100),i=Math.min(3,Math.floor(score/100*4)),t=tiers[i];quiz.classList.add('hidden');result.classList.remove('hidden');document.getElementById('score').textContent=`You got ${score}%.`;budget.textContent=t.budget;tier.textContent=t.name;choices.innerHTML=t.items.map((x,n)=>`<label class="choice"><input type="radio" name="gift" value="${x.replaceAll('"','&quot;')}" ${n?'':'checked'}> ${x}</label>`).join('')};share.onclick=()=>{let x=document.querySelector('input[name=gift]:checked');if(!x)return;let text=`I owe Yun Qi a ${x.value} 🎁`;if(navigator.share)navigator.share({title:'My birthday debt',text});else prompt('Copy this:',text)};</script></body></html>
