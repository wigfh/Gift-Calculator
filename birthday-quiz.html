<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find out what you owe me 💸</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f0ff;color:#17151a}.box{max-width:680px;margin:30px auto;padding:30px;background:#fff;border-radius:25px}h1{font-size:52px;line-height:1;margin:12px 0}label{display:block;font-weight:bold;margin:24px 0 8px}select,button{width:100%;padding:15px;border-radius:14px;font-size:16px}select{border:1px solid #ddd}button{margin-top:25px;background:#17151a;color:white;border:0;font-weight:bold}.result{display:none}.budget{font-size:52px;font-weight:900;margin:15px 0}.choice{padding:12px;border:2px solid #eee;border-radius:12px;margin:10px 0}.choice input{width:auto}</style></head><body><div class="box"><div id="quiz"><b>🎂 BIRTHDAY GIFT CALCULATOR</b><h1>Find out what you owe me. 💸</h1><p>Let's see what you owe <strong>Yun Qi</strong>.</p><label>How close are you to me?</label><select id="q1"><option value="1">We barely know each other</option><option value="2">We're friends</option><option value="3">We're pretty close</option><option value="4">I'm basically family</option><option value="5">I know way too much about you</option></select><label>How much have you annoyed me this year?</label><select id="q2"><option value="5">I am an angel 😇</option><option value="4">Barely at all</option><option value="3">A normal amount</option><option value="2">Okay... maybe a little</option><option value="1">I owe you an apology</option></select><label>How generous are you feeling?</label><select id="q3"><option value="1">Financially struggling, sorry 😭</option><option value="2">Let's be reasonable</option><option value="3">I can stretch a little</option><option value="4">It's my favourite person's birthday</option><option value="5">Money is simply a concept</option></select><button type="button" onclick="calculateGift()">Reveal my fate 💸</button></div><div id="result" class="result"><b>🎁 YOUR OFFICIAL BIRTHDAY DEBT</b><h2 id="percent"></h2><div class="budget" id="budget"></div><h2 id="tier"></h2><p>Choose your gift wisely.</p><div id="choices"></div><button type="button" onclick="shareGift()">I've chosen my gift 🎁</button></div></div><script>var tiers=[{name:'People who forgot my bday last year',budget:'RM20–30',items:['A good meal and an apology note to why you forgot last year :/']},{name:'Friends',budget:'RM5–20',items:['Silver Claw Clip','Silver Jewelry','Knee High White Socks']},{name:'Close friends',budget:'RM30–50',items:['Something funny','Something sentimental','Zuru Slime Mart','Edible Cookie Dough','Good Brie Cheese']},{name:'Family',budget:'RM30–800',items:['Sponsor My Taobao Order','Sponsor My SHEIN Order','Sponsor My Shopee Order','Onitsuka Tiger Red Shoe','Adidas Gazelle (Neutral)','New Branded Sewing Machine']}];function calculateGift(){var a=parseInt(document.getElementById('q1').value,10);var b=parseInt(document.getElementById('q2').value,10);var c=parseInt(document.getElementById('q3').value,10);var score=Math.round((a+b+c)/15*100);var index=Math.min(3,Math.floor(score/25));var t=tiers[index];document.getElementById('percent').textContent='You got '+score+'%.';document.getElementById('budget').textContent=t.budget;document.getElementById('tier').textContent=t.name;document.getElementById('choices').innerHTML=t.items.map(function(x,i){return '<label class="choice"><input type="radio" name="gift" value="'+x.replace(/"/g,'&quot;')+'" '+(i===0?'checked':'')+'> '+x+'</label>';}).join('');document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';}function shareGift(){var x=document.querySelector('input[name="gift"]:checked');if(!x)return;var text='I owe Yun Qi a '+x.value+' 🎁';if(navigator.share){navigator.share({title:'My birthday debt',text:text});}else{window.prompt('Copy this:',text);}}</script></body></html>
